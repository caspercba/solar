# Solar Dashboard — local dev stack (mock Worker + static frontend)
#
# Quick start:
#   docker compose up --build
#   open http://localhost:8080
#   Proxy URL: http://localhost:8787   Token: e2e-test-token
#
# Real Miniflare Worker (no mock fixtures):
#   API_MODE=worker docker compose up --build
#   Proxy URL: http://localhost:8787   (no token — open dev mode)

services:
  frontend:
    build: .
    command: ["/bin/sh", "scripts/docker-frontend-entry.sh"]
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    volumes:
      - .:/app
      - e2e_node_modules:/app/e2e/node_modules
    depends_on:
      api:
        condition: service_started
    environment:
      FRONTEND_PORT: "8080"

  api:
    build: .
    command: ["/bin/sh", "scripts/docker-api-entry.sh"]
    ports:
      - "${WORKER_PORT:-8787}:8787"
    volumes:
      - .:/app
      - worker_node_modules:/app/worker/node_modules
      - e2e_node_modules:/app/e2e/node_modules
      - wrangler_state:/app/worker/.wrangler
    environment:
      API_MODE: "${API_MODE:-mock}"
      WORKER_PORT: "8787"
      MOCK_WORKER_HOST: "0.0.0.0"
      MOCK_WORKER_PORT: "8787"
      MOCK_WORKER_TOKEN: "${MOCK_WORKER_TOKEN:-e2e-test-token}"

volumes:
  worker_node_modules:
  e2e_node_modules:
  wrangler_state:
